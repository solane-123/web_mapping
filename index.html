<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webmapping Risques Majeurs</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* --- 1. CONFIGURATION DA MODERNE --- */
        :root {
            /* Couleurs Modernes */
            --primary-nat: #2ecc71;   /* Vert émeraude */
            --secondary-nat: #27ae60;
            --gradient-nat: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); /* Bleu Océan */
            
            --primary-tech: #e74c3c;  /* Rouge Alizarin */
            --secondary-tech: #c0392b;
            --gradient-tech: linear-gradient(135deg, #434343 0%, black 100%); /* Industriel Sombre */

            --text-dark: #2c3e50;
            --text-light: #ecf0f1;
            --bg-page: #f4f7f6;
        }

        body { 
            margin: 0; padding: 0; 
            font-family: 'Roboto', sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-dark); 
            display: flex; flex-direction: column; height: 100vh; overflow: hidden; 
        }

        /* --- HEADER EPURE --- */
        header { 
            background-color: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px);
            padding: 0 40px; height: 70px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); 
            display: flex; align-items: center; justify-content: space-between; z-index: 1000; 
        }
        .logo-area { 
            display: flex; align-items: center; gap: 12px; 
            font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.4rem; 
            color: var(--text-dark); letter-spacing: -0.5px;
        }
        .nav-tabs { display: flex; gap: 30px; height: 100%; }
        .nav-btn { 
            background: none; border: none; height: 100%; padding: 0 5px; 
            cursor: pointer; font-size: 0.9rem; color: #7f8c8d; font-weight: 500; text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 3px solid transparent; transition: all 0.3s; 
        }
        .nav-btn:hover { color: var(--text-dark); }
        .nav-btn.active-tab { color: #2980b9; border-bottom: 3px solid #2980b9; }

        /* --- VUES --- */
        .view-section { display: none; flex: 1; height: calc(100vh - 70px); overflow: hidden; position: relative; }
        .view-section.visible { display: flex; }

        /* --- NOUVELLE VUE ACCUEIL (SPLIT SCREEN) --- */
        #view-grid { 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            background: white;
            padding: 0 20px;
        }

        .hero-title {
            text-align: center; margin-bottom: 50px; animation: fadeInDown 0.8s ease-out;
        }
        .hero-title h1 {
            font-family: 'Montserrat', sans-serif; font-size: 3rem; margin: 0; color: var(--text-dark);
        }
        .hero-title p {
            font-size: 1.2rem; color: #7f8c8d; margin-top: 10px; font-weight: 300;
        }

        .choice-container {
            display: flex; gap: 40px; width: 100%; max-width: 1200px; height: 450px;
            perspective: 1000px;
        }

        .hero-card {
            flex: 1;
            position: relative;
            border-radius: 30px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; color: white;
        }

        /* Style Naturel */
        .hero-card.nat { background: linear-gradient(135deg, #00B4DB 0%, #0083B0 100%); }
        /* Style Technologique */
        .hero-card.tech { background: linear-gradient(135deg, #232526 0%, #414345 100%); }

        .hero-card::before {
            content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.3));
            z-index: 1; transition: opacity 0.3s;
        }

        .hero-card:hover { transform: translateY(-15px) scale(1.02); box-shadow: 0 30px 60px rgba(0,0,0,0.2); }
        .hero-card:hover .card-icon { transform: scale(1.1) rotate(5deg); }

        .card-content { position: relative; z-index: 2; padding: 40px; }
        .card-icon { font-size: 5rem; margin-bottom: 20px; transition: transform 0.4s; text-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .card-title { font-family: 'Montserrat', sans-serif; font-size: 2rem; font-weight: 800; margin-bottom: 10px; }
        .card-desc { font-size: 1.1rem; font-weight: 300; opacity: 0.9; line-height: 1.5; }
        
        .card-btn {
            margin-top: 30px; padding: 12px 30px;
            background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
            border-radius: 50px; color: white; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
            backdrop-filter: blur(5px); transition: background 0.3s;
        }
        .hero-card:hover .card-btn { background: white; color: #333; }

        /* Animation d'entrée */
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }


        /* --- VUE CARTE (Plein écran) --- */
        #view-map { flex-direction: row; position: relative; width: 100%; height: 100%; }
        /* Sidebar masquée */
        .sidebar-controls { display: none; }
        
        /* Iframe & Map Containers */
        #map { flex: 1; height: 100%; display: none; }
        #external-frame-container { flex: 1; height: 100%; display: none; background: #e0e0e0; }
        iframe { width: 100%; height: 100%; border: none; }

        /* --- VUE DETAIL --- */
        #view-detail { flex-direction: column; overflow-y: auto; background: white; }
        
        /* Layout Carte Inondation (SCROLL VERTICAL) */
        .vertical-layout-map {
            width: 100%;
            height: 85vh; 
            position: relative;
            border-bottom: 5px solid #eee;
        }
        .vertical-layout-content {
            padding: 60px 40px;
            max-width: 1400px;
            margin: 0 auto;
            background: white;
        }
        
        /* Layout Carte Industriel (SPLIT) */
        .split-layout { display: flex; height: calc(100vh - 70px); }
        .left-map-area { flex: 65; position: relative; border-right: 1px solid #ddd; } /* 65% largeur */
        .right-info-area { flex: 35; overflow-y: auto; padding: 40px; background: #fff; } /* 35% largeur */

        /* Header Detail */
        .detail-header {
            padding: 20px 40px; color: white; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 10;
        }
        .back-btn {
            background: rgba(255,255,255,0.9); border: none; padding: 10px 20px; 
            border-radius: 30px; font-weight: bold; cursor: pointer; transition: transform 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .back-btn:hover { transform: translateX(-3px); }

        /* Timeline Style */
        .timeline-item { padding-left: 25px; position: relative; margin-bottom: 30px; }
        .timeline-item::before {
            content: ''; position: absolute; left: 0; top: 5px; width: 12px; height: 12px; 
            border-radius: 50%; background: currentColor; border: 3px solid white; box-shadow: 0 0 0 1px #ddd;
        }
        .timeline-year { font-family: 'Montserrat', sans-serif; font-size: 1.2rem; font-weight: 800; display: block; margin-bottom: 5px; }
        .timeline-content { font-size: 0.95rem; color: #555; line-height: 1.5; }

        /* Scroll Indicator */
        .scroll-indicator {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 10px 25px; border-radius: 30px;
            font-size: 0.9rem; animation: float 2s infinite; pointer-events: none;
        }
        @keyframes float { 0%, 100% {transform:translate(-50%,0);} 50% {transform:translate(-50%,-10px);} }

    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <i class="fa-solid fa-earth-europe" style="color: #2980b9;"></i>
            <span>Risques France</span>
        </div>
        <nav class="nav-tabs">
            <button class="nav-btn active-tab" onclick="switchView('grid')">Accueil</button>
            <button class="nav-btn" onclick="openMap('naturel')">Carte Naturelle</button>
            <button class="nav-btn" onclick="openMap('technique')">Carte Technologique</button>
        </nav>
    </header>

    <section id="view-grid" class="view-section visible">
        
        <div class="hero-title">
            <h1>Observatoire des Risques</h1>
            <p>Plateforme nationale de visualisation des aléas</p>
        </div>

        <div class="choice-container">
            <div class="hero-card nat" onclick="openMap('naturel')">
                <div class="card-content">
                    <div class="card-icon"><i class="fa-solid fa-cloud-showers-heavy"></i></div>
                    <div class="card-title">Risques Naturels</div>
                    <div class="card-desc">Inondations, Séismes, Mouvements de terrain, Radon...</div>
                    <div class="card-btn">Explorer la carte</div>
                </div>
            </div>

            <div class="hero-card tech" onclick="openMap('technique')">
                <div class="card-content">
                    <div class="card-icon"><i class="fa-solid fa-industry"></i></div>
                    <div class="card-title">Risques Technologiques</div>
                    <div class="card-desc">Installations classées Seveso, Centrales Nucléaires, Pollution...</div>
                    <div class="card-btn">Explorer la carte</div>
                </div>
            </div>
        </div>

    </section>

    <section id="view-map" class="view-section">
        <aside class="sidebar-controls"></aside>
        <div id="map"></div> <div id="external-frame-container">
            <iframe id="main-map-frame" src=""></iframe>
        </div>
    </section>

    <section id="view-detail" class="view-section"></section>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // --- DONNEES ---
        const detailsContent = {
            'inondation': { 
                title: "Inondations", color: "#0083B0", icon: "fa-water", 
                desc: "Carte interactive et comparative des risques d'inondation en France.",
                timeline: [{year:"2017", t:"Données Inondation", d:"Analyse nationale."}],
                chartTitle: "Coût (Mrd €)", chartType: 'line', chartLabels: ['2010', '2015', '2020', '2023'], chartData: [1.2, 0.8, 1.5, 1.1]
            },
            'industriel': { 
                title: "Risques Technologiques", color: "#414345", icon: "fa-industry", 
                desc: "Cartographie globale des risques technologiques et industriels (Sites Seveso, etc.).",
                timeline: [{year:"2001", t:"Explosion AZF", d:"Plus grave accident industriel."}, {year:"2019", t:"Lubrizol Rouen", d:"Incendie majeur."}],
                chartTitle: "Sites Seveso", chartType: 'bar', chartLabels: ['Seuil Haut', 'Seuil Bas'], chartData: [700, 600]
            }
            // (Autres types supprimés car non accessibles depuis l'accueil simplifié, mais ajoutables ici)
        };

        var currentChart = null; 

        // --- NAVIGATION ---
        function switchView(name) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('visible'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active-tab'));
            
            const view = document.getElementById('view-' + name);
            if(view) view.classList.add('visible');
            
            if(name === 'grid') document.querySelectorAll('.nav-btn')[0].classList.add('active-tab');
        }

        // --- OUVERTURE CARTES PRINCIPALES ---
        function openMap(mode) {
            switchView('map');
            const navBtns = document.querySelectorAll('.nav-btn');
            const iframe = document.getElementById('main-map-frame');
            
            // Affichage Iframe
            document.getElementById('external-frame-container').style.display = 'block';
            document.getElementById('map').style.display = 'none'; 

            if (mode === 'naturel') {
                iframe.src = "https://lietheo.github.io/DEP_NAT/";
                navBtns[1].classList.add('active-tab');
            } else {
                iframe.src = "https://lietheo.github.io/DEP_TECH/";
                navBtns[2].classList.add('active-tab');
            }
        }

        // --- OUVERTURE FICHE DETAIL (Si accessible via la carte) ---
        function openDetail(key) {
            const d = detailsContent[key];
            if(!d) return;

            let html = `
                <div class="detail-header" style="background:${d.color};">
                    <div style="display:flex; align-items:center; gap:15px;">
                        <i class="fa-solid ${d.icon}" style="font-size:2rem;"></i>
                        <h1 style="margin:0; font-family:'Montserrat', sans-serif;">${d.title}</h1>
                    </div>
                    <button class="back-btn" onclick="switchView('grid')" style="color:${d.color}">
                        <i class="fa-solid fa-arrow-left"></i> Retour
                    </button>
                </div>`;

            // CAS INONDATION (SCROLL)
            if(key === 'inondation') {
                html += `
                    <div class="vertical-layout-map">
                        <iframe src="https://lietheo.github.io/DEP_NAT/"></iframe>
                        <div class="scroll-indicator">▼ Infos détaillées en bas</div>
                    </div>
                    <div class="vertical-layout-content">
                        <div style="display:flex; flex-wrap:wrap; gap:60px;">
                            <div style="flex:1; min-width:350px;">
                                <h2 style="font-family:'Montserrat'; color:${d.color}; border-bottom:2px solid #eee; padding-bottom:10px;">Statistiques</h2>
                                <div style="height:350px; margin-top:20px;"><canvas id="riskChart"></canvas></div>
                            </div>
                            <div style="flex:1; min-width:350px;">
                                <h2 style="font-family:'Montserrat'; color:${d.color}; border-bottom:2px solid #eee; padding-bottom:10px;">Historique</h2>
                                <div style="margin-top:30px; border-left:3px solid ${d.color}; padding-left:20px;">
                                    ${d.timeline.map(t => `
                                        <div class="timeline-item" style="color:${d.color}">
                                            <span class="timeline-year">${t.year}</span>
                                            <div class="timeline-content"><strong>${t.t}</strong><br>${t.d}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>`;
            } 
            // CAS INDUSTRIEL (SPLIT)
            else if (key === 'industriel') {
                html += `
                    <div class="split-layout">
                        <div class="left-map-area"><iframe src="https://lietheo.github.io/DEP_TECH/"></iframe></div>
                        <div class="right-info-area">
                            <h2 style="font-family:'Montserrat'; color:${d.color};">Statistiques</h2>
                            <div style="height:250px; margin-bottom:40px;"><canvas id="riskChart"></canvas></div>
                            <h2 style="font-family:'Montserrat'; color:${d.color};">Historique</h2>
                            <div style="margin-top:20px; border-left:3px solid ${d.color}; padding-left:20px;">
                                ${d.timeline.map(t => `
                                    <div class="timeline-item" style="color:${d.color}">
                                        <span class="timeline-year">${t.year}</span>
                                        <div class="timeline-content"><strong>${t.t}</strong><br>${t.d}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>`;
            }

            document.getElementById('view-detail').innerHTML = html;
            switchView('detail');

            if (d.chartData) {
                const ctx = document.getElementById('riskChart');
                if(ctx) {
                    if (currentChart) currentChart.destroy();
                    currentChart = new Chart(ctx, { type: d.chartType, data: { labels: d.chartLabels, datasets: [{ label: d.chartTitle, data: d.chartData, backgroundColor: d.color, borderColor: d.color, borderWidth:1 }] }, options: { responsive: true, maintainAspectRatio: false } });
                }
            }
        }
    </script>
</body>
</html>
